# Fly.io app configuration, modelled on mazeps's. Reference:
# https://fly.io/docs/reference/configuration/
#
# PLACEHOLDER: `app` is a guess. Use the name `fly apps create` gives you (and
# keep them in step). This file was written without flyctl and has not been
# checked with `fly config validate`; run that before the first deploy.

app = 'josuzuki-blog'
primary_region = 'gru'

[build]

[deploy]
  # Needs DATABASE_URL and DIRECT_URL as secrets. Runs on a temporary machine
  # built from the new image, before any machine is replaced.
  release_command = 'npx prisma migrate deploy'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  # The public origin. Feeds, the WebSocket origin check and the Google
  # sign-in all depend on it: keep it equal to the address people use.
  SITE_URL = 'https://josuzuki.me'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Answered by server.js before the HTTPS redirect and without the database.
  [[http_service.checks]]
    method = 'GET'
    path = '/healthz'
    protocol = 'http'
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
