# Deploys to Fly.io on every push to main. See
# https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
#
# Needs the FLY_API_TOKEN repository secret (`fly tokens create deploy`).
# Without it the job succeeds and deploys nothing.

name: Fly Deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group # only one deploy at a time
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Skip when FLY_API_TOKEN is not set
        if: ${{ env.FLY_API_TOKEN == '' }}
        run: echo "::notice::FLY_API_TOKEN is not set, skipping the deploy."
      - uses: actions/checkout@v4
        if: ${{ env.FLY_API_TOKEN != '' }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: ${{ env.FLY_API_TOKEN != '' }}
      # One machine: socket rooms and rate limits live in process memory.
      - run: flyctl deploy --remote-only --ha=false
        if: ${{ env.FLY_API_TOKEN != '' }}
